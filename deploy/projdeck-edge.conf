# projdeck 公网入口（服务器上的 nginx，host 网络）
#
#   公网 https://<IP>:18420  ──►  127.0.0.1:17420（SSH 反向隧道）──►  本机 agentd 127.0.0.1:7420
#
# 访问 key：没有 key cookie 的请求一律 404，扫描器连登录页都看不到。
# 第一次在浏览器打开 https://<IP>:18420/k/<KEY>，记下 cookie 后跳到首页；之后还需要 projdeck 密码登录。
# 部署时把 __KEY__ 替换为 ~/.config/projdeck/edge-key 的内容（只含 URL 安全字符）。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 18420 ssl;
    http2 on;
    server_name 120.26.194.174;
    server_tokens off;
    access_log off;

    # 复用服务器上已有的 Let's Encrypt IP 证书（由 wx-monitor-share-renew.timer 续期）
    ssl_certificate     /etc/letsencrypt/live/wx-monitor-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wx-monitor-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 文件管理器单个文件上限 1GB（agentd 端同样限制），留一点余量
    client_max_body_size 1100m;

    location = /k/__KEY__ {
        add_header Set-Cookie "projdeck_key=__KEY__; Path=/; Max-Age=31536000; Secure; HttpOnly; SameSite=Lax" always;
        add_header Cache-Control "no-store" always;
        return 302 /;
    }

    location / {
        if ($cookie_projdeck_key != "__KEY__") {
            return 404;
        }

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        # 只允许本站嵌入（电脑上的 CC Switch 页面嵌入它的原版界面）
        add_header X-Frame-Options SAMEORIGIN always;

        proxy_pass http://127.0.0.1:17420;
        proxy_http_version 1.1;
        # Host 带端口：agentd 用它和 Origin 比对，防止跨站请求
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 覆盖而不是追加，客户端无法伪造来源 IP（agentd 按它做登录限流）
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
        # 网页终端是长连接
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
