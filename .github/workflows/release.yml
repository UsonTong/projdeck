name: Release

# 推到 main 就构建网页和安卓 App，发布成 GitHub Release（固定 tag: latest），
# 本机的 projdeck-agentd 定期拉取这个 Release 部署。见 deploy/autoupdate.sh。
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-web:
    if: github.repository == 'UsonTong/projdeck'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: tar -czf web-dist.tar.gz -C packages/web dist
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web-dist.tar.gz
          retention-days: 1

  build-apk:
    if: github.repository == 'UsonTong/projdeck'
    runs-on: ubuntu-latest
    env:
      # runner 预装了 Android SDK；不用 setup-android（它默认装已废弃的 tools 包会失败）
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      # 和本地同一把签名密钥，手机才能覆盖安装
      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$HOME/release.jks"
          mkdir -p "$HOME/.config/projdeck/android"
          cat > "$HOME/.config/projdeck/android/keystore.properties" <<PROPS
          storeFile=$HOME/release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          PROPS
      - name: Build APK
        run: |
          cd packages/mobile
          # 和 deploy/release.sh 一致的版本号：2026 年起的分钟数，单调递增
          build=$(( ($(date +%s) - 1767225600) / 60 ))
          flutter build apk --release --target-platform android-arm64 --build-number "$build"
          cp build/app/outputs/flutter-apk/app-release.apk projdeck.apk
          version="2.5.3+$build"
          printf '{"version":"%s","size":%d,"builtAt":"%s","commit":"%s"}\n' \
            "$version" "$(stat -c %s projdeck.apk)" "$(date -Iseconds)" "${{ github.sha }}" > version.json
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            packages/mobile/projdeck.apk
            packages/mobile/version.json
          retention-days: 1

  release:
    if: github.repository == 'UsonTong/projdeck'
    needs: [build-web, build-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest web-dist.tar.gz projdeck.apk version.json \
            --title "latest" --notes "自动构建于 $(date -Iseconds)，commit ${{ github.sha }}" --prerelease
